<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTN Code Formatter Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Custom Icon Component to handle Lucide
        const Icon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState("");
            
            useEffect(() => {
                if (window.lucide) {
                    const iconSvg = window.lucide.createIcons();
                }
            }, []);

            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [files, setFiles] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [stats, setStats] = useState({ total: 0, formatted: 0 });

            useEffect(() => {
                // Initialize lucide icons after render
                if (window.lucide) window.lucide.createIcons();
            }, [files, stats]);

            const loadScript = (url) => {
                return new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = resolve;
                    document.head.appendChild(script);
                });
            };

            const initLibraries = async () => {
                if (!window.js_beautify) {
                    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.min.js');
                    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js');
                    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-css.min.js');
                    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
                }
            };

            const handleFolderUpload = async (event) => {
                const uploadedFiles = Array.from(event.target.files);
                const validExtensions = ['.js', '.json', '.html', '.css', '.txt'];
                
                const fileData = await Promise.all(
                    uploadedFiles
                        .filter(file => validExtensions.some(ext => file.name.endsWith(ext)))
                        .map(async (file) => {
                            const content = await file.text();
                            return {
                                name: file.name,
                                path: file.webkitRelativePath || file.name,
                                originalContent: content,
                                formattedContent: null,
                                status: 'pending',
                                size: file.size,
                                type: file.name.split('.').pop()
                            };
                        })
                );

                setFiles(fileData);
                setStats({ total: fileData.length, formatted: 0 });
            };

            const formatAllFiles = async () => {
                await initLibraries();
                setIsProcessing(true);
                
                const options = {
                    indent_size: 2,
                    indent_char: " ",
                    max_preserve_newlines: 2,
                    preserve_newlines: true,
                    keep_array_indentation: false,
                    break_chained_methods: false,
                    indent_scripts: "normal",
                    brace_style: "collapse",
                    space_before_conditional: true,
                    unescape_strings: false,
                    jslint_happy: false,
                    end_with_newline: true,
                    wrap_line_length: 0,
                    indent_inner_html: false,
                    comma_first: false,
                    e4x: false,
                    indent_empty_lines: false
                };

                const updatedFiles = files.map(file => {
                    try {
                        let formatted = file.originalContent;
                        if (file.type === 'js' || file.type === 'json') {
                            formatted = window.js_beautify(file.originalContent, options);
                        } else if (file.type === 'html') {
                            formatted = window.html_beautify(file.originalContent, options);
                        } else if (file.type === 'css') {
                            formatted = window.css_beautify(file.originalContent, options);
                        }

                        return {
                            ...file,
                            formattedContent: formatted,
                            status: 'success'
                        };
                    } catch (err) {
                        return { ...file, status: 'error' };
                    }
                });

                setFiles(updatedFiles);
                setStats(prev => ({ ...prev, formatted: updatedFiles.filter(f => f.status === 'success').length }));
                setIsProcessing(false);
            };

            const downloadAsZip = async () => {
                if (!window.JSZip) await initLibraries();
                const zip = new window.JSZip();
                
                files.forEach(file => {
                    const content = file.formattedContent || file.originalContent;
                    zip.file(file.path, content);
                });

                const content = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(content);
                const link = document.createElement('a');
                link.href = url;
                link.download = `GTN_Formatted_${new Date().getTime()}.zip`;
                link.click();
            };

            const clearFiles = () => {
                setFiles([]);
                setStats({ total: 0, formatted: 0 });
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-5xl mx-auto">
                        <header className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <div>
                                <h1 className="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent flex items-center gap-3">
                                    <Icon name="zap" className="text-blue-400 fill-blue-400/20" />
                                    GTN Formatter Pro
                                </h1>
                                <p className="text-slate-400 mt-1">Merapikan format script massal dalam sekejap.</p>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <button onClick={clearFiles} className="p-2 hover:bg-slate-800 rounded-lg text-slate-400 transition-colors">
                                    <Icon name="trash-2" size={20} />
                                </button>
                                <div className="h-8 w-px bg-slate-700" />
                                <div className="bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-4">
                                    <div className="text-center">
                                        <p className="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Total</p>
                                        <p className="text-lg font-mono font-bold">{stats.total}</p>
                                    </div>
                                    <div className="text-center border-l border-slate-700 pl-4">
                                        <p className="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Rapi</p>
                                        <p className="text-lg font-mono font-bold text-emerald-400">{stats.formatted}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            <label className="relative group cursor-pointer">
                                <input type="file" webkitdirectory="true" directory="true" multiple onChange={handleFolderUpload} className="hidden" />
                                <div className="h-32 border-2 border-dashed border-slate-700 group-hover:border-blue-500 group-hover:bg-blue-500/5 rounded-2xl flex flex-col items-center justify-center transition-all">
                                    <Icon name="folder-open" className="text-slate-500 group-hover:text-blue-400 mb-2" size={32} />
                                    <span className="font-semibold text-slate-300">Pilih Folder</span>
                                    <span className="text-[10px] text-slate-500">Unggah seluruh direktori script</span>
                                </div>
                            </label>

                            <button 
                                disabled={files.length === 0 || isProcessing}
                                onClick={formatAllFiles}
                                className="h-32 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:opacity-50 rounded-2xl flex flex-col items-center justify-center transition-all shadow-xl shadow-blue-900/20"
                            >
                                <Icon name="zap" className={`${isProcessing ? 'animate-pulse' : ''} mb-2 text-white`} size={32} />
                                <span className="font-bold text-white text-lg">Format Sekarang</span>
                                <span className="text-xs text-blue-100/70">Otomatis luruskan baris</span>
                            </button>

                            <button 
                                disabled={stats.formatted === 0}
                                onClick={downloadAsZip}
                                className="h-32 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:opacity-50 rounded-2xl flex flex-col items-center justify-center transition-all shadow-xl shadow-indigo-900/20"
                            >
                                <Icon name="download" className="mb-2 text-white" size={32} />
                                <span className="font-bold text-white text-lg">Download ZIP</span>
                                <span className="text-xs text-indigo-100/70">Unduh hasil yang sudah rapi</span>
                            </button>
                        </div>

                        <div className="bg-slate-800/40 rounded-2xl border border-slate-700 overflow-hidden backdrop-blur-sm">
                            <div className="p-4 border-b border-slate-700 bg-slate-800/60 flex justify-between items-center">
                                <h2 className="font-bold flex items-center gap-2">
                                    <Icon name="file-code" size={18} className="text-blue-400" />
                                    Daftar File
                                </h2>
                                <span className="text-[10px] text-slate-500 font-mono font-bold">JS • HTML • CSS • JSON Support</span>
                            </div>
                            
                            <div className="max-h-[450px] overflow-y-auto">
                                {files.length === 0 ? (
                                    <div className="p-20 text-center flex flex-col items-center opacity-20">
                                        <Icon name="box" size={64} className="mb-4" />
                                        <p className="text-lg font-bold">Belum ada file</p>
                                        <p className="text-sm">Pilih folder untuk memulai proses</p>
                                    </div>
                                ) : (
                                    <table className="w-full text-left border-collapse">
                                        <thead className="sticky top-0 bg-slate-800 text-slate-500 text-[10px] uppercase font-black tracking-widest border-b border-slate-700">
                                            <tr>
                                                <th className="p-4">Path File</th>
                                                <th className="p-4">Ukuran</th>
                                                <th className="p-4">Tipe</th>
                                                <th className="p-4 text-right">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/50">
                                            {files.map((file, idx) => (
                                                <tr key={idx} className="hover:bg-slate-700/20 transition-colors">
                                                    <td className="p-4">
                                                        <div className="flex flex-col">
                                                            <span className="font-semibold text-slate-200 text-sm">{file.name}</span>
                                                            <span className="text-[10px] text-slate-500 font-mono truncate max-w-xs">{file.path}</span>
                                                        </div>
                                                    </td>
                                                    <td className="p-4 text-xs text-slate-400 font-mono">
                                                        {(file.size / 1024).toFixed(1)} KB
                                                    </td>
                                                    <td className="p-4">
                                                        <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase border ${
                                                            file.type === 'js' ? 'bg-yellow-500/5 text-yellow-500 border-yellow-500/20' :
                                                            file.type === 'html' ? 'bg-orange-500/5 text-orange-500 border-orange-500/20' :
                                                            file.type === 'css' ? 'bg-blue-500/5 text-blue-500 border-blue-500/20' :
                                                            'bg-slate-500/5 text-slate-400 border-slate-500/20'
                                                        }`}>
                                                            {file.type}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        {file.status === 'pending' && <span className="text-slate-500 text-xs">Menunggu</span>}
                                                        {file.status === 'success' && <span className="text-emerald-400 text-xs font-bold flex items-center justify-end gap-1"><Icon name="check-circle-2" size={14} /> Berhasil</span>}
                                                        {file.status === 'error' && <span className="text-red-400 text-xs font-bold flex items-center justify-end gap-1"><Icon name="alert-circle" size={14} /> Gagal</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>

                        <footer className="mt-12 text-center border-t border-slate-800 pt-8 opacity-60">
                            <p className="text-[10px] font-black tracking-[0.2em] text-slate-500 uppercase">
                                Powered by GTN Engine &copy; 2024
                            </p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
